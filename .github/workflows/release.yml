name: Release Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'package.v3.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pkg_file="package.v3.json"
          [ -f "$pkg_file" ] || { echo "缺少 $pkg_file"; exit 1; }

          # 只处理显式声明 release=true 的插件
          mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "没有 release=true 的插件条目"
            exit 0
          fi

          for entry in "${entries[@]}"; do
            plugin_id="${entry%%|*}"
            plugin_version="${entry##*|}"
            plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"
            plugin_dir="plugins.v3/$plugin_id_lc"

            if [ ! -d "$plugin_dir" ]; then
              echo "找不到插件目录: $plugin_dir" >&2
              exit 1
            fi

            tag="${plugin_id}_v${plugin_version}"
            asset="${plugin_id_lc}_v${plugin_version}.zip"
            release_notes="$(jq -r --arg id "$plugin_id" --arg v "v$plugin_version" '.[$id].history[$v] // empty' "$pkg_file")"
            if [ -z "$release_notes" ]; then
              release_notes="Automated release of $plugin_id $plugin_version"
            fi

            # 若目录自上一个同插件 Tag 以来无变化则跳过打包
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && git diff --quiet "$tag" -- "$plugin_dir"; then
              echo "自 $tag 以来 $plugin_dir 无变化，跳过打包"
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release edit "$tag" --notes "$release_notes"
              fi
              continue
            fi

            echo "打包 $plugin_id : $plugin_dir -> $asset"
            rm -f "$asset"
            (cd "plugins.v3" && zip -r "$GITHUB_WORKSPACE/$asset" "$plugin_id_lc" \
              -x "*/__pycache__/*" -x "*.pyc" -x "*/node_modules/*") >/dev/null

            # 同版本重跑时替换旧 Release
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag 已存在，删除后重建"
              gh release delete "$tag" -y
              git push origin ":refs/tags/$tag" || true
            fi
            git tag -d "$tag" >/dev/null 2>&1 || true

            gh release create "$tag" "$asset" \
              --title "$tag" \
              --notes "$release_notes" \
              --latest \
              --target "$GITHUB_SHA"
          done
