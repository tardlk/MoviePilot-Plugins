[project]
# V3 插件依赖清单（规范 §7.5 / 仓库指南 §6.2）：
# - MoviePilot V3 宿主只读取本文件的静态 project.dependencies；
# - 版本仍由插件类与 package.v3.json 维护，故此处声明 dynamic version；
# - 不提交 uv.lock，也不在插件代码中执行 pip / uv。
name = "moviepilot-plugin-strm2emby"
dynamic = ["version"]
description = "Strm2Emby —— 将光鸭云盘接入 MoviePilot 存储，并内置目录同步、手动上传、上传记录与 LitePan 联动。"
requires-python = ">=3.12"
dependencies = [
    # 定时同步（get_service 注册 CronTrigger）
    "apscheduler>=3.10",
    # OSS 分片上传与断点续传
    "oss2>=2.18",
    # 目录实时监控（延迟导入，缺失时仅打日志跳过，不影响其它功能）
    "watchfiles>=0.21",
]
